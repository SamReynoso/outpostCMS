<!DOCTYPE html>
<html>
<head>
  <title>Dev Dashboard</title>
  <style>
    :root {
      --main-bg-color: rgb(235, 235, 235);
      --main-text-color: rgb(41, 4, 7);
      --main-font: Arial, sans-serif;
      --nice-head-color: rgb(248, 248, 248);
      --nice-border-color: #f0f0f0;

      --cell-height: 3rem;
      --left-padding: 2rem;
      --border-thickness: 1px;
      --border-color: rgb(204, 204, 204);
    }

    html * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    body {
      font-family: var(--main-font);
      background-color: var(--main-bg-color);
      color: var(--main-text-color);
      padding: 0.5em;
    }

    table { 
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      text-align: center;
    }
    th {
      padding-left: var(--left-padding);
    }
    .articles-list {
      display: flex;
    }

    .articles-list ul {
      list-style: none;
    }

    .articles-list li {
      display: block;
      text-align: center;
      border: var(--border-thickness) solid var(--border-color);
    }

    .meta-form {
      max-width: 80ch;
      margin: 1.5rem auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .meta-form label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
    }

    .meta-form input[type="text"],
    .meta-form input[type="email"],
    .meta-form input[type="date"],
    .meta-form textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .meta-form .checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      font-weight: normal;
    }

    .meta-form button {
      padding: 0.75rem;
      background: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .meta-form button:hover {
      background: #005fa3;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background-color: var(--nice-head-color);
      border-bottom: var(--border-thickness) solid var(--border-color);
    }

    h1 {
      font-size: 2rem;
      text-align: center;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/">Main</a>
    <a href="/edit/{{ meta.canonical }}">Open in editor</a>
    <a href="/archive/{{ meta.canonical }}">View</a>
  </nav>

  <header>
    <h1>Metadata Forms</h1>
  </header>

  <nav class="nav">
    <table>
      <tr>
        <td><a href="/edit/meta/{{ meta.canonical }}">Basic</a></td>
        <td><a href="/edit/open-graph/{{ meta.canonical }}">Open Graph</a></td>
        <td><a href="/edit/twitter/{{ meta.canonical }}">Twitter Card</a></td>
        <td><a href="/edit/ai/{{ meta.canonical }}">AI Metadata</a></td>
      </tr>
    </table>
  </nav>

  <form class="meta-form" method="post" action="/edit-metadata">
  <h2>Metadata for {{ meta.canonical }}</h2>
  <hr>
    <label class="checkbox"><input type="checkbox" name="public" {% if meta.public %}checked{% endif %}> Public</label>
    <label>Title <input type="text" name="title" value="{{ meta.title }}"></label>
    <label>Date <input type="date" name="date" value="{{ meta.date }}"> </label>
    <label>Description <textarea name="description" rows="4">{{ meta.description }}</textarea> </label>
    <label>Path <input type="text" name="path" value="{{ meta.path }}"></label>


    <label>Author <input type="email" name="author" value="sam@ozprealpha.com"> </label>
    <label>Last Updated <input type="text" name="last_updated" value="{{ meta.last_updated }}"> </label>
    <label>Version <input type="text" name="version" value="{{ meta.version }}"> </label>
    <label>Canonical Slug <input type="text" name="canonical" value="{{ meta.canonical }}"></label>
    <button type="submit">Save Changes</button>
  </form>
</body>
</html>
