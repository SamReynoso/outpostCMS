{% extends "metadata/base.html" %}

{% block form %}
<form
  class="meta-form"
  method="post"
  action="{{ form_action }}"
  enctype="application/x-www-form-urlencoded"
  >
  <h3>{{ form_header }}</h3>
  <label>Title<input type="text" name="title" value="{{ entry.basic.title }}" required></label>
  <label>Description<textarea name="description" required>{{ entry.basic.description }}</textarea></label>
  <label>Author<input type="text" name="author" value="{{ entry.basic.author }}" required></label>
  <label>Published<input type="text" name="date" value="{{ entry.basic.date }}"></label>
  <label>Modified<input type="text" name="modified" value="{{ entry.basic.modified }}"></label>

  <button type="submit">Submit</button>
{% endblock %}
