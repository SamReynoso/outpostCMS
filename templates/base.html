<!DOCTYPE html>
<html lang="en">
<head>
  <title>{% block title %}Content Console{% endblock %}</title>
  <style>
    :root {
      --main-bg-color: rgb(235, 235, 235);
      --main-text-color: rgb(41, 4, 7);
      --main-font: Arial, sans-serif;
      --nice-head-color: rgb(248, 248, 248);
      --nice-border-color: #f0f0f0;

      --cell-height: 3rem;
      --left-padding: 2rem;
      --border-thickness: 1px;
      --border-color: rgb(204, 204, 204);
    }

    html * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--main-font);
      background-color: var(--main-bg-color);
      color: var(--main-text-color);
      padding: 1em;
    }

    table { 
      width: 100%;
      border-collapse: collapse;
    }

    td:first-child {
      font-size: 0.8rem;
      background-color: var(--nice-head-color);
      text-align: center;
    }

    td:last-child {
      font-size: 0.8rem;
      text-align: center;
      background-color: var(--nice-head-color);
      padding: 0.5rem;
    }

    th, td {
      text-align: left;
      border: var(--border-thickness) solid var(--border-color);
    }
    th {
      padding-left: var(--left-padding);
    }
    .articles-list {
      display: flex;
    }

    .articles-list ul {
      list-style: none;
    }

    .articles-list li {
      display: block;
      text-align: center;
      border: var(--border-thickness) solid var(--border-color);
    }


    dl.expanded {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.25rem 1rem;
      padding: 0.5rem;
      background: #f9f9f9;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    dl.expanded dt {
      font-weight: 600;
      color: #333;
      white-space: nowrap;
    }

    dl.expanded dd {
      color: #555;
      overflow-wrap: anywhere;
    }

    dl.expanded dd:last-of-type {
      font-size: 0.85rem;
      color: #999;
    }
    details.article-details {
      background: #fff;
    }

    details.article-details summary {
      font-weight: bold;
      cursor: pointer;
      padding: 0.5rem 1rem;
      background-color: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }

    table.article-links {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      margin-bottom: 0.5rem;
      layout: fixed;

    }
    table.article-links th {
      background-color: rgba(225, 45, 45, 0.3); 
      height: .4rem;
      border-right: 2px solid rgb(100, 100, 100);
    }
    table.article-links th:last-child {
      border-right: none;
    }
    table.article-links td {
      text-align: center;
      background-color: rgb(248, 248, 248);
      width: 25%; 
      border: 0;
    }

    .meta-form {
      max-width: 80ch;
      margin: 1.5rem auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .meta-form label {
      display: flex;
      flex-direction: column;
      font-weight: 600;
    }

    .meta-form input[type="text"],
    .meta-form input[type="email"],
    .meta-form input[type="date"],
    .meta-form textarea {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .meta-form .checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.5rem;
      font-weight: normal;
    }

    .meta-form button {
      padding: 0.75rem;
      background: #007acc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .meta-form button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <nav>
    {% if request.path != '/' %}
      <a href="/">Content Console</a>
    {% endif %}
  <nav>
  <main>
    <section>
      <h1>{{ title }}</h1>
    {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
