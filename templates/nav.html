<!DOCTYPE html>
<html>
<head>
  <title>Dev Dashboard</title>
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 2em; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f8f8f8; }
  </style>
</head>
<body>
  <h1>Dev Mode Dashboard</h1>
  <table>
    <thead>
      <tr><th>Title</th><th>View</th><th>Edit</th></tr>
    </thead>
    <tbody>
      {% for article in articles %}
      <tr>
        <td>{{ article.meta.title if article.meta else article.path }}</td>
        <td><a href="/archive/{{ article.canonical }}">View</a></td>
        <td><a href="/edit/{{ article.canonical }}">Edit</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
